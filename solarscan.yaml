# SolarScan screening assumptions. Every value can be overridden here.
# Sources are listed in solarscan/config.py.

default_tilt_deg: 15.0
array_layout: south        # south | aligned
setback_m: 1.5
module_efficiency: 0.20
packing_factor: 0.70
dc_ac_ratio: 1.2
pvgis_site: sharjah        # sharjah | dubai | abu_dhabi | ajman | ras_al_khaimah

cost_per_kw: 3000.0        # AED per kWp installed
rate_aed: 0.38             # AED per kWh
grid_co2_kg_per_kwh: 0.42
discount_rate: 0.05
lifetime_years: 25
annual_degradation: 0.005
om_cost_fraction: 0.015
