[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solarscan"
version = "1.0.0"
description = "Rooftop solar pre-feasibility screening from OpenStreetMap building footprints"
readme = "README.md"
authors = [
    { name = "Oumar Mamoun Ibrahim", email = "U22200741@sharjah.ac.ae" },
    { name = "Mohamad Khairi bin Ishak", email = "mishak@sharjah.ac.ae" },
    { name = "Mir Umer Jarwar", email = "U20105400@sharjah.ac.ae" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["solar", "photovoltaic", "openstreetmap", "pre-feasibility", "gis", "pvgis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "requests",
    "pyyaml",
    "matplotlib",
    "reportlab",
    "shapely>=2.0",
    "pyproj>=3.4"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pvlib>=0.10", "pandas", "pypdf", "playwright"]

[project.urls]
"Homepage" = "https://github.com/IamOumarIbrahim/rooftop-scanning"
"Repository" = "https://github.com/IamOumarIbrahim/rooftop-scanning.git"

[project.scripts]
solarscan = "solarscan.cli:main"

[project.gui-scripts]
solarscan-gui = "solarscan.gui:main"

[tool.setuptools]
packages = ["solarscan"]

[tool.setuptools.package-data]
solarscan = ["data/pvgis/*.json", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
